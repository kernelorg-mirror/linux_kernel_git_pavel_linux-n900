# Generated by ktest.pl
#

# PWD is a ktest.pl variable that will result in the process working
# directory that ktest.pl is executed in.

# THIS_DIR is automatically assigned the PWD of the path that generated
# the config file. It is best to use this variable when assigning other
# directory paths within this directory. This allows you to easily
# move the test cases to other locations or to other machines.
#
THIS_DIR := /data/l/linux-good/tools/testing/ktest

# Define each test with TEST_START
# The config options below it will override the defaults
TEST_START
TEST_TYPE = test
BISECT_TYPE = test
BISECT_GOOD = v3.14
BISECT_BAD = v3.15
TEST = ssh root@amd /data/l/linux-good/tools/testing/selftests/power/sleep

DEFAULTS
LOCALVERSION = -test
POWER_CYCLE = echo "Please reboot"; read A
CONSOLE = sleep 60; ssh pavel@amd dmesg; echo "login:"
REBOOT_TYPE = grub2
SSH_USER = root
BUILD_OPTIONS = -j3
BUILD_DIR = /data/l/clean-cg
OUTPUT_DIR = /data/tmp/ktest
MACHINE = amd
TARGET_IMAGE = /boot/vmlinuz-test
BUILD_TARGET = arch/x86/boot/bzImage
GRUB_MENU = New Debian ktest
GRUB_FILE = /boot/grub/grub.cfg
MIN_CONFIG = /data/l/linux-good/.config
LOG_FILE = /data/tmp/ktest/log
MAKE_CMD = nice make
BUILD_NOCLEAN = 1

GRUB_REBOOT = grub-set-default
BUILD_TYPE = nobuild
